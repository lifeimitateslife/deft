name: Build and test
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      signed_macos:
        description: Build notarized Mac installers using Apple signing secrets
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            flags: --win --x64
          - os: macos-14
            platform: macos-arm64
            flags: --mac --arm64
          - os: macos-15-intel
            platform: macos-x64
            flags: --mac --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:ui
      - run: npm run test:session
      - run: npm run test:handoff
      - name: Package development builds or Windows installer
        if: runner.os != 'macOS' || (!startsWith(github.ref, 'refs/tags/') && !inputs.signed_macos)
        run: npx electron-builder ${{ matrix.flags }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Sign and notarize Mac release
        if: runner.os == 'macOS' && (startsWith(github.ref, 'refs/tags/') || inputs.signed_macos)
        run: npx electron-builder ${{ matrix.flags }} --config electron-builder.mac-release.cjs --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - run: node scripts/package-test.cjs
      - name: Verify final Mac disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          DISTRIBUTION: ${{ startsWith(github.ref, 'refs/tags/') || inputs.signed_macos }}
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/deft-verify"
          hdiutil verify release/*.dmg
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" release/*.dmg
          trap 'hdiutil detach "$mount"' EXIT
          args=()
          if [[ "$DISTRIBUTION" == "true" ]]; then args+=(--distribution); fi
          node scripts/verify-mac.cjs "$mount/DEFT.app" "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: deft-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

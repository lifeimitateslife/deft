name: Build and test
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      signed_macos:
        description: Build notarized Mac installers using Apple signing secrets
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            flags: --win --x64
          - os: macos-14
            platform: macos-arm64
            flags: --mac --arm64
          - os: macos-15-intel
            platform: macos-x64
            flags: --mac --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Save Windows native candidate
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-blur-native-candidate
          path: desktop/native/windows-blur.node
      - run: npm run test:ui
      - run: npm run test:session
      - run: npm run test:handoff
      - name: Package free builds or Windows installer
        if: runner.os != 'macOS' || !inputs.signed_macos
        run: npx electron-builder ${{ matrix.flags }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # This step uses only an ad-hoc Mac identity and receives no secrets.
          # electron-builder otherwise skips even ad-hoc signing on PRs.
          CSC_FOR_PULL_REQUEST: "true"
      - name: Sign and notarize optional Mac release
        if: runner.os == 'macOS' && inputs.signed_macos
        run: npx electron-builder ${{ matrix.flags }} --config electron-builder.mac-release.cjs --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Enable transparency on disposable Mac test runner
        if: runner.os == 'macOS'
        run: defaults write com.apple.universalaccess reduceTransparency -bool false
      - run: node scripts/package-test.cjs
      - name: Verify Windows background compositing
        if: runner.os == 'Windows'
        run: node tests/windows-blur-strength.mjs
        env:
          DEFT_EXECUTABLE: ${{ github.workspace }}/release/win-unpacked/DEFT.exe
      - name: Save Windows blur evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-blur-verification
          path: |
            .scratch/windows-blur-strength-*/results.json
            .scratch/windows-blur-strength-*/*.png
            .scratch/windows-blur-ui-*/*.png
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Save tabs and recent files evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deft-${{ matrix.platform }}-tabs-recents
          path: .scratch/tabs-recents-*/*.png
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Save update notice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deft-${{ matrix.platform }}-update-notice
          path: .scratch/update-notice-*/notice.png
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Verify Mac background compositing
        if: runner.os == 'macOS' && !cancelled()
        shell: bash
        env:
          DEFT_KOFFI_MODULE: ${{ github.workspace }}/.scratch/mac-capture/node_modules/koffi
          DEFT_EXECUTABLE: ${{ github.workspace }}/release/${{ matrix.platform == 'macos-arm64' && 'mac-arm64' || 'mac' }}/DEFT.app/Contents/MacOS/DEFT
        run: |
          npm install --prefix .scratch/mac-capture --no-save koffi@3.2.1
          node tests/mac-transparency.mjs
          node tests/mac-blur-strength.mjs
      - name: Save Mac compositor evidence
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: deft-${{ matrix.platform }}-verification
          path: |
            .scratch/mac-transparency-*/results.json
            .scratch/mac-transparency-*/*.png
            .scratch/mac-blur-strength-*/results.json
            .scratch/mac-blur-strength-*/*.png
            .scratch/mac-blur-ui-*/*.png
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Verify final Mac disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          DISTRIBUTION: ${{ inputs.signed_macos }}
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/deft-verify"
          hdiutil verify release/*.dmg
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" release/*.dmg
          trap 'verify_status=$?; hdiutil detach "$mount"; exit "$verify_status"' EXIT
          test -f "$mount/INSTALL-MAC.txt"
          if [[ "$DISTRIBUTION" == "true" ]]; then
            node scripts/verify-mac.cjs "$mount/DEFT.app" --distribution
          else
            node scripts/verify-mac.cjs "$mount/DEFT.app"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: deft-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error
